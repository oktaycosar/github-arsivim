<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Arşivim</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#162e2b;font:16px system-ui}main{max-width:920px;margin:auto;padding:55px 22px}header{margin-bottom:36px}.tag{color:#158379;font-size:13px;font-weight:700;letter-spacing:.14em}h1{font-size:clamp(36px,7vw,60px);letter-spacing:-.05em;margin:12px 0}p{color:#617570;line-height:1.6}.panel,.item{background:white;border:1px solid #dfe9e5;border-radius:18px;padding:24px;box-shadow:0 8px 30px #14372a08}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700;display:grid;gap:7px}label:nth-child(3){grid-column:1/-1}input,textarea{width:100%;padding:13px;border:1px solid #cbdad5;border-radius:9px;font:inherit}textarea{resize:vertical;min-height:75px}button,.button{border:0;border-radius:9px;background:#166e65;color:white;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer}button:hover{opacity:.85}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px}.bar h2{margin:0}.secondary{background:#e8f1ed;color:#245b50;font-size:14px}.list{display:grid;gap:12px}.item{padding:20px}.item h3{margin:0 0 7px}.item p{margin:8px 0}.item a{color:#147c71;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:14px}.actions button{background:#edf3f0;color:#385c53;font-size:13px;padding:8px 12px}.empty{text-align:center;padding:35px;color:#73857f}.note{font-size:13px} @media(max-width:600px){form{grid-template-columns:1fr}label:nth-child(3){grid-column:auto}.bar{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main><header><div class="tag">KİŞİSEL BAĞLANTI DEFTERİ</div><h1>GitHub Arşivim<span style="color:#21a899">.</span></h1><p>İlham veren projeler ve daha sonra dönüp bakmak istediklerin, bir arada.</p></header><section class="panel"><h2>Yeni bağlantı ekle</h2><form id="form"><label>Proje adı<input id="name" required placeholder="Örn. PDF to EPUB"></label><label>GitHub bağlantısı<input id="url" type="url" required placeholder="https://github.com/..."></label><label>Açıklama<textarea id="description" placeholder="Bu proje ne işe yarıyor?"></textarea></label><div><button>Bağlantıyı kaydet →</button></div></form></section><div class="bar"><h2>Kaydettiklerim <span id="count"></span></h2><div><button class="secondary" id="export">Yedek indir</button> <button class="secondary" id="import">Yedek yükle</button><input id="file" type="file" accept="application/json" hidden></div></div><input id="search" placeholder="Bağlantılarında ara..." aria-label="Bağlantılarda ara"><div class="list" id="list" style="margin-top:14px"></div><p class="note">Bağlantılar bu tarayıcıda saklanır; başka cihazlarda otomatik görünmez. Kaybolmamaları için ara sıra yedek indir.</p></main><script>const key='oktay-github-links-v1', $=s=>document.querySelector(s);let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch{}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){let q=$('#search').value.toLocaleLowerCase('tr');$('#count').textContent='· '+data.length;let list=$('#list');list.replaceChildren();let rows=data.filter(x=>(x.name+' '+x.url+' '+x.description).toLocaleLowerCase('tr').includes(q));if(!rows.length){let el=document.createElement('div');el.className='panel empty';el.textContent=data.length?'Aramana uygun bağlantı bulunamadı.':'Henüz bir bağlantı eklemedin. İlk projeni yukarıdan kaydet.';list.append(el)}rows.forEach(x=>{let box=document.createElement('article');box.className='item';let h=document.createElement('h3');h.textContent=x.name;let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.url;let p=document.createElement('p');p.textContent=x.description;let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>{$('#name').value=x.name;$('#url').value=x.url;$('#description').value=x.description;data=data.filter(y=>y.id!==x.id);save();window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.textContent='Sil';del.onclick=()=>{if(confirm('Bu bağlantı silinsin mi?')){data=data.filter(y=>y.id!==x.id);save()}};actions.append(edit,del);box.append(h,a,p,actions);list.append(box)})}$('#form').onsubmit=e=>{e.preventDefault();let url=$('#url').value.trim();try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0}catch{alert('Geçerli bir bağlantı gir.');return}data.unshift({id:Date.now()+Math.random(),name:$('#name').value.trim(),url,description:$('#description').value.trim()});save();e.target.reset()};$('#search').oninput=render;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='github-arsivim.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let rows=JSON.parse(await e.target.files[0].text());if(!Array.isArray(rows)||!rows.every(x=>typeof x.name==='string'&&typeof x.url==='string'&&typeof x.description==='string'&&/^https?:\/\//i.test(x.url)))throw 0;if(confirm('Yedekteki bağlantılar mevcut listeye eklensin mi?')){data=[...rows.map(x=>({...x,id:Date.now()+Math.random()})),...data];save()}}catch{alert('Yedek dosyası okunamadı.')}e.target.value=''};render();</script></body></html>
